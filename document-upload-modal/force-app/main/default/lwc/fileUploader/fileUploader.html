<template>
	<lightning-card variant="narrow" icon-name="standard:document" class="slds-p-horizontal_x-small">
        <h3 slot="title">
			Attach your document
        </h3>
	
		
		<div class="slds-grid slds-gutters slds-gutters_medium slds-grid_vertical-align-start slds-grid_align-start">
			<div class="slds-col slds-size_8-of-12 folder-picker-wrap">
				<template if:false={isCustomFolder}>
					<lightning-combobox
						name="progress"
						label="Folder"
						value={selectedFolder}
						placeholder="Select Folder"
						options={folderOptions}
						onchange={handleFolderSelect}
						required
					></lightning-combobox>
				</template>
			</div>

			<lightning-file-upload 
				name="fileUploader"
				accept={acceptedFormats}
				record-id={recordId}
				onuploadfinished={handleUploadFinished}
				disabled={isFolderInvalid}
				class="slds-col slds-size_4-of-12"
				multiple
			></lightning-file-upload>
		</div>
	</lightning-card>

	<template if:true={newFolderModalOpen}>
		<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeNewFolderModal}>
						<lightning-icon icon-name="utility:close"
							alternative-text="close"
							variant="inverse"
							size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">
						Create new Folder
					</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
					<lightning-input
						type="text"
						label="Enter new file name" 
						value={newFolder.fileName}
						onchange={validateNewFolderName}
						variant="label-hidden"
						required
					></lightning-input>
				</div>
				
				<footer class="slds-modal__footer">
					<button class="slds-button slds-button_neutral" 
						onclick={closeNewFolderModal}
						title="Cancel"
					>
						Cancel
					</button>
					<button class="slds-button slds-button_brand" 
						onclick={handleNewFolderCreate} 
						disabled={isNewFolderNameInvalid} 
						title="Delete"
					>
						Create
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={isLoading}>
		<lightning-spinner alternative-text="Loading..." variant="brand">
		</lightning-spinner>
	</template>
</template>
