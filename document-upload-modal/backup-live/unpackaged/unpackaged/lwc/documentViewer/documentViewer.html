<template>
	<template if:false={isCompactView}>
		<div class="dv">
			<header class="dv-head">
				<div class="dv-head__title">
					<span class="dv-head__icon">
						<lightning-icon icon-name="utility:file" size="small" variant="inverse"></lightning-icon>
					</span>
					<div>
						<h2 class="dv-head__heading">Loan documents</h2>
						<p class="dv-head__sub">{docs.length} files in {allFolders.length} folders</p>
					</div>
				</div>
				<div class="dv-head__actions">
					<lightning-input
						type="search"
						variant="label-hidden"
						label="Search documents"
						placeholder="Search documents"
						class="dv-search"
						value={filter}
						onchange={handleFilterChange}
					></lightning-input>
					<template if:true={canAddDocument}>
						<button class="pill pill--primary" onclick={openAddDocumentModal} title="Add a document to this record">
							<lightning-icon icon-name="utility:upload" size="xx-small"></lightning-icon>
							<span>Add document</span>
						</button>
					</template>
					<button class="pill" onclick={downloadAllFiles} title="Download every document as a zip">
						<lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>
						<span>Download all</span>
					</button>
					<button class="pill pill--icon" onclick={connectedCallback} title="Refresh">
						<lightning-icon icon-name="utility:refresh" size="xx-small" alternative-text="Refresh"></lightning-icon>
					</button>
				</div>
			</header>

			<div class="dv-body">
				<nav class="dv-rail" aria-label="Folders">
					<template for:each={railFolders} for:item="folder">
						<button
							key={folder.name}
							type="button"
							class={folder.cssClass}
							data-name={folder.name}
							aria-current={folder.ariaCurrent}
							onclick={handleFolderSelect}
							ondragover={handleFolderDragOver}
							ondragleave={handleFolderDragLeave}
							ondrop={handleFolderDrop}
						>
							<lightning-icon icon-name={folder.icon} size="x-small" class="dv-rail__icon"></lightning-icon>
							<span class="dv-rail__name">{folder.name}</span>
							<span class="dv-count">{folder.count}</span>
						</button>
					</template>
				</nav>

				<section class="dv-pane">
					<div class="dv-pane__head">
						<div class="dv-pane__title">
							<template if:true={hasVisibleFiles}>
								<input
									type="checkbox"
									class="dv-check"
									aria-label="Select every document shown in this folder"
									title="Select all"
									checked={allVisibleSelected}
									onchange={handleSelectAllVisible}
								/>
							</template>
							<div>
								<h3 class="dv-pane__heading">{selectedFolderName}</h3>
								<p class="dv-pane__sub">Drag to reorder, or drop onto a folder on the left to move</p>
							</div>
						</div>
						<template if:true={hasSelection}>
							<div class="dv-selection" role="status">
								<span class="dv-selection__count">{selectionLabel}</span>
								<button class="pill pill--primary" onclick={downloadSelected} title="Download the selected documents as a zip">
									<lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>
									<span>Download selected</span>
								</button>
								<template if:true={canOfferMerge}>
									<button class="pill" onclick={openMergeModal} disabled={mergeDisabled} title={mergeButtonTitle}>
										<lightning-icon icon-name="utility:merge" size="xx-small"></lightning-icon>
										<span>Merge into one PDF</span>
									</button>
								</template>
								<button class="pill" onclick={handleClearSelection}>Clear</button>
							</div>
						</template>
						<lightning-button-menu
							alternative-text="Folder actions"
							icon-size="small"
							menu-alignment="right"
							onselect={handleFolderMenu}
						>
							<lightning-menu-item value="rename" label="Rename folder"></lightning-menu-item>
							<lightning-menu-item value="download" label="Download folder"></lightning-menu-item>
						</lightning-button-menu>
					</div>

					<template if:true={hasVisibleFiles}>
						<ul class="dv-grid" role="list" ondragover={handleGridDragOver} ondrop={handleGridDrop}>
							<template for:each={visibleFiles} for:item="file">
								<li
									key={file.id}
									class={file.cssClass}
									draggable="true"
									data-id={file.id}
									ondragstart={handleDragStart}
									ondragend={handleDragEnd}
									ondragover={handleCardDragOver}
									ondrop={handleCardDrop}
								>
									<input
										type="checkbox"
										class="dv-check dv-card__check"
										data-id={file.id}
										aria-label={file.selectLabel}
										checked={file.isSelected}
										onchange={handleToggleSelect}
									/>
									<template if:true={file.mergePosition}>
										<span class="dv-card__order" title="Position in a merge: the order you ticked">{file.mergePosition}</span>
									</template>
									<button type="button" class="dv-card__thumb" data-file-id={file.id} onclick={handleMobilePreview} title="Preview">
										<lightning-icon icon-name={file.displayIcon} size="large" class="dv-card__fallback"></lightning-icon>
										<template if:true={file.thumbnailUrl}>
											<img src={file.thumbnailUrl} alt={file.fileNameWithType} loading="lazy" draggable="false" onerror={handleThumbError} />
										</template>
									</button>
									<div class="dv-card__body">
										<div class="dv-card__name" title={file.fileNameWithType}>{file.fileNameWithType}</div>
										<div class="dv-card__meta">{file.createdBy} · {file.shortDate}</div>
										<template if:true={file.hasCondition}>
											<span class="dv-chip" title={file.conditionName}>{file.conditionName}</span>
										</template>
									</div>
									<lightning-button-menu
										class="dv-card__menu"
										alternative-text="File actions"
										icon-size="x-small"
										menu-alignment="auto"
										data-file-id={file.id}
										onselect={handleMobileFileAction}
									>
										<lightning-menu-item value="download" label="Download"></lightning-menu-item>
										<lightning-menu-item value="renameFile" label="Rename file"></lightning-menu-item>
										<lightning-menu-item value="changeFolder" label="Change folder"></lightning-menu-item>
										<lightning-menu-item value="relateCondition" label="Relate to loan condition"></lightning-menu-item>
										<lightning-menu-item value="delete" label="Delete"></lightning-menu-item>
									</lightning-button-menu>
								</li>
							</template>
						</ul>
					</template>

					<template if:false={hasVisibleFiles}>
						<div class="dv-empty">
							<lightning-icon icon-name="utility:open_folder" size="small"></lightning-icon>
							<p>{emptyStateText}</p>
						</div>
					</template>
				</section>
			</div>
		</div>
	</template>
	<!-- Phones: touch cannot drag, so the stacked card list and its menus stay as they were. -->
	<template if:true={isCompactView}>
	<lightning-card variant="narrow" icon-name="standard:file" class="document-viewer-card slds-p-horizontal_x-small">
		<h3 slot="title">Loan Documents</h3>


		<template if:true={isCompactView}>
			<div class="toolbar toolbar--mobile">
				<lightning-input
					type="text"
					label="Search documents"
					value={filter}
					onchange={handleFilterChange}
				></lightning-input>
				<div class="toolbar__actions">
					<button class="pill pill--search" onclick={handleFilterFiles}>
						<lightning-icon icon-name="utility:search" size="xx-small" variant="inverse"></lightning-icon>
						<span>Search</span>
					</button>
					<template if:true={canAddDocument}>
						<button class="pill pill--primary" onclick={openAddDocumentModal}>
							<lightning-icon icon-name="utility:upload" size="xx-small"></lightning-icon>
							<span>Add Document</span>
						</button>
					</template>
					<button class="pill" onclick={downloadAllFiles}>
						<lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>
						<span>Download All</span>
					</button>
					<button class="pill" onclick={connectedCallback}>
						<lightning-icon icon-name="utility:refresh" size="xx-small"></lightning-icon>
						<span>Refresh</span>
					</button>
				</div>
			</div>
		</template>

		<div slot="footer" class="document-viewer-footer">
			<span>Total folders: {allFolders.length}</span>
			<span>Total documents: {docs.length}</span>
		</div>

		<lightning-accordion allow-multiple-sections-open active-section-name={activeFolders}>
			<template for:each={folders} for:item="folder" for:index="folderIndex">
				<lightning-accordion-section name={folder.name} label={folder.name} key={folder.name}>
					<lightning-button-menu
						slot="actions"
						alternative-text="Show menu"
						icon-size="x-small"
						menu-alignment="auto"
						class="folder-actions-menu"
					>
						<lightning-menu-item
							value="Rename"
							label="Rename Folder"
							onclick={openRenameFolderModal}
							data-index={folderIndex}
						></lightning-menu-item>
						<lightning-menu-item
							value="Download"
							label="Download Folder"
							onclick={downloadFolder}
							data-index={folderIndex}
						></lightning-menu-item>
					</lightning-button-menu>

					<template if:true={isCompactView}>
						<ul class="mobile-file-list" role="list">
							<template for:each={folder.data} for:item="file">
								<li key={file.id} class="mobile-file-card" role="listitem">
									<div class="mobile-file-card__header">
										<button
											type="button"
											class="mobile-file-card__preview"
											title="Preview"
											data-file-id={file.id}
											onclick={handleMobilePreview}
										>
											<lightning-icon
												icon-name="utility:preview"
												size="x-small"
												alternative-text="Preview"
											></lightning-icon>
										</button>

										<template if:true={file.thumbnailUrl}>
											<img
												class="mobile-file-card__thumb"
												src={file.thumbnailUrl}
												alt={file.fileNameWithType}
												loading="lazy"
											/>
										</template>

										<div class="mobile-file-card__identity">
											<template if:true={file.fileTypeIcon}>
												<lightning-icon
													icon-name={file.fileTypeIcon}
													size="small"
													alternative-text="File type"
													class="mobile-file-card__type-icon"
												></lightning-icon>
											</template>
											<span class="mobile-file-card__name">{file.fileNameWithType}</span>
										</div>

										<lightning-button-menu
											alternative-text="File actions"
											icon-size="small"
											menu-alignment="auto"
											data-file-id={file.id}
											onselect={handleMobileFileAction}
											class="mobile-file-card__menu"
										>
											<lightning-menu-item value="download" label="Download"></lightning-menu-item>
											<lightning-menu-item value="renameFile" label="Rename File"></lightning-menu-item>
											<lightning-menu-item value="changeFolder" label="Change Folder"></lightning-menu-item>
											<lightning-menu-item value="delete" label="Delete"></lightning-menu-item>
											<lightning-menu-item
												value="relateCondition"
												label="Relate to Loan Condition"
											></lightning-menu-item>
										</lightning-button-menu>
									</div>

									<div class="mobile-file-card__meta">
										<div class="mobile-file-card__meta-row">
											<span class="mobile-file-card__meta-label">Condition</span>
											<span class="mobile-file-card__meta-value">{file.conditionName}</span>
										</div>
										<div class="mobile-file-card__meta-row">
											<span class="mobile-file-card__meta-label">Created By</span>
											<span class="mobile-file-card__meta-value">{file.createdBy}</span>
										</div>
										<div class="mobile-file-card__meta-row">
											<span class="mobile-file-card__meta-label">Created Date</span>
											<span class="mobile-file-card__meta-value">{file.formattedCreatedDate}</span>
										</div>
									</div>
								</li>
							</template>
						</ul>
					</template>
				</lightning-accordion-section>
			</template>
		</lightning-accordion>
	</lightning-card>
	</template>

	<template if:true={renameFolderModalOpen}>
		<section
			role="dialog"
			tabindex="-1"
			aria-labelledby="modal-heading-01"
			aria-modal="true"
			aria-describedby="modal-content-id-1"
			class="slds-modal slds-fade-in-open document-viewer-modal"
		>
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button
						class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
						title="Close"
						onclick={closeRenameFolderModal}
					>
						<lightning-icon
							icon-name="utility:close"
							alternative-text="close"
							variant="inverse"
							size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Rename Folder</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
					<lightning-input
						type="text"
						label={renameFolderLabel}
						value={folderToRename.newName}
						onchange={validateNewFolderName}
						pattern="[\s\dA-Za-z]+"
						required
					></lightning-input>
				</div>

				<footer class="slds-modal__footer document-viewer-modal__footer">
					<button class="slds-button slds-button_neutral" onclick={closeRenameFolderModal} title="Cancel">
						Cancel
					</button>
					<button
						class="slds-button slds-button_brand"
						onclick={handleFolderRename}
						disabled={isNewFolderNameInvalid}
						title="Rename"
					>
						Rename
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={deleteModalOpen}>
		<section
			role="dialog"
			tabindex="-1"
			aria-labelledby="modal-heading-02"
			aria-modal="true"
			aria-describedby="modal-content-id-2"
			class="slds-modal slds-fade-in-open document-viewer-modal"
		>
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button
						class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
						title="Close"
						onclick={closeDeleteModal}
					>
						<lightning-icon
							icon-name="utility:close"
							alternative-text="close"
							variant="inverse"
							size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">Delete Document</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
					<p>Are you sure you want to delete file "{fileToDelete.fileName}.{fileToDelete.fileType}"?</p>
				</div>

				<footer class="slds-modal__footer document-viewer-modal__footer">
					<button class="slds-button slds-button_neutral" onclick={closeDeleteModal} title="Cancel">
						Cancel
					</button>
					<button class="slds-button slds-button_brand" onclick={handleFileDelete} title="Delete">
						Delete
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={changeFolderModalOpen}>
		<section
			role="dialog"
			tabindex="-1"
			aria-labelledby="modal-heading-03"
			aria-modal="true"
			aria-describedby="modal-content-id-3"
			class="slds-modal slds-fade-in-open document-viewer-modal"
		>
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button
						class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
						title="Close"
						onclick={closeChangeFolderModal}
					>
						<lightning-icon
							icon-name="utility:close"
							alternative-text="close"
							variant="inverse"
							size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="modal-heading-03" class="slds-text-heading_medium slds-hyphenate">
						Change folder for "{fileToChangeFolder.fileName}.{fileToChangeFolder.fileType}"
					</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-3">
					<lightning-combobox
						name="progress"
						label="Select new folder"
						value={selectedDefaultFolder}
						placeholder="Select Folder"
						options={changeFolderOptions}
						onchange={handleNewFolderSelect}
						required
					></lightning-combobox>
				</div>

				<footer class="slds-modal__footer document-viewer-modal__footer">
					<button class="slds-button slds-button_neutral" onclick={closeChangeFolderModal} title="Cancel">
						Cancel
					</button>
					<button
						class="slds-button slds-button_brand"
						onclick={handleFolderChange}
						disabled={isNewFolderForFileInvalid}
						title="Change Folder"
					>
						Change Folder
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={renameFileModalOpen}>
		<section
			role="dialog"
			tabindex="-1"
			aria-labelledby="modal-heading-04"
			aria-modal="true"
			aria-describedby="modal-content-id-4"
			class="slds-modal slds-fade-in-open document-viewer-modal"
		>
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button
						class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
						title="Close"
						onclick={closeRenameFileModal}
					>
						<lightning-icon
							icon-name="utility:close"
							alternative-text="close"
							variant="inverse"
							size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="modal-heading-04" class="slds-text-heading_medium slds-hyphenate">
						Rename "{fileToRename.fileName}.{fileToRename.fileType}"
					</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-4">
					<lightning-input
						type="text"
						label="Enter new file name"
						value={fileToRename.fileName}
						onchange={validateNewFileName}
						required
					></lightning-input>
				</div>

				<footer class="slds-modal__footer document-viewer-modal__footer">
					<button class="slds-button slds-button_neutral" onclick={closeRenameFileModal} title="Cancel">
						Cancel
					</button>
					<button
						class="slds-button slds-button_brand"
						onclick={handleFileRename}
						disabled={isNewFileNameInvalid}
						title="Rename"
					>
						Rename
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={relateConditionModalOpen}>
		<section
			role="dialog"
			tabindex="-1"
			aria-labelledby="modal-heading-05"
			aria-modal="true"
			aria-describedby="modal-content-id-5"
			class="slds-modal slds-fade-in-open document-viewer-modal"
		>
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button
						class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
						title="Close"
						onclick={closeConditionPickModal}
					>
						<lightning-icon
							icon-name="utility:close"
							alternative-text="close"
							variant="inverse"
							size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="modal-heading-05" class="slds-text-heading_medium slds-hyphenate">
						Pick Condition for "{fileToRelate.fileName}.{fileToRelate.fileType}"
					</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-5">
					<lightning-combobox
						name="conditionsPicker"
						label="Select condition to relate"
						options={conditionOptions}
						onchange={handleNewConditionPick}
						required
					></lightning-combobox>
				</div>

				<footer class="slds-modal__footer document-viewer-modal__footer">
					<button class="slds-button slds-button_neutral" onclick={closeConditionPickModal} title="Cancel">
						Cancel
					</button>
					<button
						class="slds-button slds-button_brand"
						onclick={handleConditionRelate}
						title="Relate"
						disabled={relateConditionDisabled}
					>
						Relate
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={addDocumentModalOpen}>
		<section
			role="dialog"
			tabindex="-1"
			aria-labelledby="add-document-heading"
			aria-modal="true"
			aria-describedby="add-document-content"
			class="slds-modal slds-fade-in-open document-viewer-modal"
		>
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button
						class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
						title="Close"
						onclick={closeAddDocumentModal}
					>
						<lightning-icon
							icon-name="utility:close"
							alternative-text="close"
							variant="inverse"
							size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="add-document-heading" class="slds-text-heading_medium slds-hyphenate">Add Document</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="add-document-content">
					<lightning-combobox
						label="Folder"
						value={uploadFolder}
						options={folderOptions}
						onchange={handleUploadFolderChange}
						required
					></lightning-combobox>

					<lightning-input
						class="slds-m-top_small"
						type="text"
						label="Document Label"
						value={uploadLabel}
						field-level-help="Becomes the document name. Leave blank to keep the file name. Applies when you add one file at a time."
						onchange={handleUploadLabelChange}
					></lightning-input>

					<div class="slds-m-top_medium add-document__drop-zone">
						<lightning-file-upload
							label="Drag a file here, or browse"
							name="documentUpload"
							record-id={recordId}
							onuploadfinished={handleUploadFinished}
							multiple
						></lightning-file-upload>
					</div>

					<p class="slds-m-top_small add-document__hint">
						The document is attached as soon as it finishes uploading, then filed under the
						folder above.
					</p>
				</div>

				<footer class="slds-modal__footer document-viewer-modal__footer">
					<button class="slds-button slds-button_neutral" onclick={closeAddDocumentModal}>
						Done
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={mergeModalOpen}>
		<section
			role="dialog"
			tabindex="-1"
			aria-labelledby="merge-heading"
			aria-modal="true"
			class="slds-modal slds-fade-in-open document-viewer-modal"
		>
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button
						class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
						title="Close"
						onclick={closeMergeModal}
						disabled={isMerging}
					>
						<lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="merge-heading" class="slds-text-heading_medium slds-hyphenate">Merge into one PDF</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium">
					<lightning-input
						type="text"
						label="Name of the merged file"
						value={mergeTitle}
						onchange={handleMergeTitleChange}
						disabled={isMerging}
						required
					></lightning-input>
					<p class="dv-merge__hint">Pages go in the order you ticked the files:</p>
					<ol class="dv-merge__list">
						<template for:each={mergeList} for:item="item">
							<li key={item.id}>
								<span class="dv-merge__position">{item.position}</span>
								<span class="dv-merge__name">{item.name}</span>
								<template if:true={item.isPart}>
									<span class="dv-chip">deleted after merge</span>
								</template>
							</li>
						</template>
					</ol>
					<template if:true={mergePartNote}>
						<p class="dv-merge__hint">{mergePartNote} Every other file is kept.</p>
					</template>
					<template if:true={isMerging}>
						<div class="dv-merge__working">
							<div class="dv-merge__spin"><lightning-spinner alternative-text="Merging" size="small"></lightning-spinner></div>
							<span>Merging and saving. Long statements can take a minute.</span>
						</div>
					</template>
					<!-- Does the work: see DocumentMergeBridge.page for why it is not Apex. -->
					<iframe class="dv-merge-bridge" src="/apex/DocumentMergeBridge" title="Merge helper" tabindex="-1"></iframe>
				</div>

				<footer class="slds-modal__footer document-viewer-modal__footer">
					<button class="slds-button slds-button_neutral" onclick={closeMergeModal} disabled={isMerging}>Cancel</button>
					<button class="slds-button slds-button_brand" onclick={handleMerge} disabled={mergeConfirmDisabled}>Merge</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={isLoading}>
		<lightning-spinner alternative-text="Loading..." variant="brand"></lightning-spinner>
	</template>
</template>
