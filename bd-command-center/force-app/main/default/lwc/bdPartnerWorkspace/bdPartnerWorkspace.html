<template>
    <template lwc:if={error}><div class="card pad err" role="alert">{error}</div></template>
    <template lwc:if={loading}><div class="card pad"><lightning-spinner alternative-text="Loading partner" size="small"></lightning-spinner></div></template>

    <template lwc:if={p}>
        <div class="wrap">
            <section class="card head">
                <div class="toprow">
                    <div class="av big">{p.initials}</div>
                    <div class="grow">
                        <div class="namerow">
                            <h2 class="name">{p.name}</h2>
                            <span class={industryCls}>{p.industry}</span>
                            <template lwc:if={p.isBorrower}><span class="chip oth">Borrower</span></template>
                        </div>
                        <div class="muted sub">{subLine}</div>
                    </div>
                    <template lwc:if={canEdit}>
                        <button class="btn" onclick={openTouch}>Log touch</button>
                        <button class="btn" onclick={invite}>Invite</button>
                        <button class="btn" onclick={openLead}>New Lead from this Partner</button>
                    </template>
                    <template lwc:if={p.phone}>
                        <span class="dial"><lightning-click-to-dial value={p.phone} record-id={p.id}></lightning-click-to-dial></span>
                    </template>
                </div>

                <template lwc:if={isDormant}>
                    <div class="dormant">Dormant: no automatic stage moves until a referral arrives or you change the stage.</div>
                </template>
                <template lwc:else>
                    <div>
                        <div class="steps">
                            <template for:each={stageSteps} for:item="s"><div key={s.value} class={s.barCls}></div></template>
                        </div>
                        <div class="steplbls">
                            <template for:each={stageSteps} for:item="s"><span key={s.value} class={s.labelCls}>{s.value}</span></template>
                        </div>
                    </div>
                </template>
            </section>

            <template lwc:if={showTouch}>
                <c-bd-log-touch-modal partner-id={p.id} partner-name={p.name} onlogged={touchLogged} onclose={closeTouch}></c-bd-log-touch-modal>
            </template>

            <template lwc:if={showLead}>
                <section class="card pad form">
                    <div class="h2">New Lead from {p.name}</div>
                    <div class="two">
                        <lightning-input label="First name" data-field="firstName" onchange={handleLead} required></lightning-input>
                        <lightning-input label="Last name" data-field="lastName" onchange={handleLead} required></lightning-input>
                        <lightning-input type="tel" label="Phone" data-field="phone" onchange={handleLead}></lightning-input>
                        <lightning-input type="email" label="Email" data-field="email" onchange={handleLead}></lightning-input>
                    </div>
                    <lightning-textarea label="Notes for the LO" data-field="notes" onchange={handleLead}></lightning-textarea>
                    <div class="muted small">The lead is routed by normal lead assignment with {p.name} as the Referral Source.</div>
                    <div class="actions"><button class="btn" onclick={closeLead}>Cancel</button><button class="btn btn-p" disabled={leadDisabled} onclick={saveLead}>Create lead</button></div>
                </section>
            </template>

            <div class="cols">
                <section class="card main">
                    <div class="tabs" role="tablist">
                        <button class={timelineTabCls} role="tab" onclick={showTimeline}>Timeline</button>
                        <template lwc:if={canEdit}><button class={activityTabCls} role="tab" onclick={showActivity}>Zoom</button></template>
                        <button class={ringSenseTabCls} role="tab" onclick={showRingSense}>RingSense</button>
                        <button class={leadsTabCls} role="tab" onclick={showLeads}>Referred leads ({leadCount})</button>
                    </div>
                    <template lwc:if={isTimeline}>
                        <template lwc:if={hasTimeline}>
                            <template for:each={timeline} for:item="t">
                                <div key={t.id} class="tl">
                                    <div class={t.dotCls}><lightning-icon icon-name={t.icon} size="x-small"></lightning-icon></div>
                                    <div class="grow">
                                        <div class="strong">{t.title}</div>
                                        <div class="muted small">{t.detail}</div>
                                    </div>
                                    <span class="muted small nowrap">{t.when}</span>
                                </div>
                            </template>
                        </template>
                        <template lwc:else><div class="empty muted">No activity yet. Calls, texts, emails and meetings show up here automatically.</div></template>
                    </template>
                    <template lwc:if={isActivity}>
                        <div class="rs"><c-bd-zoom-panel record-id={p.id} onscheduled={load}></c-bd-zoom-panel></div>
                    </template>
                    <template lwc:if={isRingSense}>
                        <div class="rs"><c-call-insight-list record-id={p.id} source="RingSense"></c-call-insight-list></div>
                    </template>
                    <template lwc:if={isLeads}>
                        <template lwc:if={hasLeads}>
                            <template for:each={leads} for:item="l">
                                <div key={l.id} class="tl clickable" data-id={l.id} onclick={openRecord}>
                                    <div class="grow"><div class="strong">{l.name}</div><div class="muted small">{l.status} · {l.ownerName}</div></div>
                                    <span class="muted small">{l.createdDate}</span>
                                </div>
                            </template>
                        </template>
                        <template lwc:else><div class="empty muted">No referred leads yet.</div></template>
                    </template>
                </section>

                <aside class="side">
                    <section class="card pad facts">
                        <div class="lbl">Relationship</div>
                        <div class="fact"><span class="muted">Last touch</span><b class={quietCls}>{lastTouchLabel}</b></div>
                        <div class="fact"><span class="muted">Calls · 30d</span><b>{detail.calls30}</b></div>
                        <div class="fact"><span class="muted">Meetings held</span><b>{detail.meetingsHeld}</b></div>
                        <div class="fact"><span class="muted">Referred leads · 90d</span><b>{p.referredLeads90}</b></div>
                        <div class="fact"><span class="muted">Account owner</span><b>{p.ownerName}</b></div>
                        <template lwc:if={canEdit}>
                            <lightning-combobox label="Stage" options={stageOptions} value={p.stage} onchange={changeStage}></lightning-combobox>
                            <lightning-combobox label="Industry" options={industryOptions} value={p.industry} onchange={changeIndustry}></lightning-combobox>
                        </template>
                        <template lwc:if={p.intakeUrl}>
                            <div class="intake">
                                <div class="lbl">Lead intake link</div>
                                <div class="muted small">Active Partner: send this so their leads come back to them.</div>
                                <input class="intake-url" type="text" readonly value={p.intakeUrl} aria-label="Lead intake link" onclick={selectAll}>
                                <button class="btn btn-s" onclick={copyIntake}>Copy link</button>
                            </div>
                        </template>
                        <button class="linkish" onclick={openRecord}>Open full account</button>
                    </section>
                    <template lwc:if={nextEvent}>
                        <section class="card pad next clickable" onclick={openEvent}>
                            <div class="lbl gold">Next up</div>
                            <div class="nexttitle">{nextEvent.name}</div>
                            <div class="nextsub">{nextEvent.when}</div>
                            <div class="nextsub">{nextEvent.attending} attending · {nextEvent.awaiting} awaiting</div>
                        </section>
                    </template>
                </aside>
            </div>
        </div>
    </template>
</template>
