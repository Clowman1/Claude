<template>
    <lightning-card title={cardTitle} icon-name={iconName}>
        <span slot="actions" class="slds-badge">{count}</span>

        <template if:true={error}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small slds-text-color_error">
                {error}
            </div>
        </template>

        <template if:true={isEmpty}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small slds-text-color_weak">
                {emptyMessage}
            </div>
        </template>

        <template if:true={hasRows}>
            <ul class="slds-has-dividers_bottom-space">
                <template for:each={rows} for:item="row">
                    <li key={row.id}
                        class="slds-item slds-p-horizontal_medium slds-p-vertical_x-small tile"
                        data-id={row.id}
                        onclick={handleOpen}>

                        <div class="slds-text-heading_small slds-truncate">{row.name}</div>

                        <div class="slds-text-body_small slds-text-color_weak slds-truncate">
                            <template if:true={row.borrower}>{row.borrower} &middot; </template>{row.status}
                        </div>

                        <div class="slds-text-body_small slds-truncate">
                            <template if:true={row.amount}>
                                <lightning-formatted-number
                                    value={row.amount}
                                    format-style="currency"
                                    currency-code="USD"
                                    maximum-fraction-digits="0">
                                </lightning-formatted-number>
                            </template>
                            <template if:true={row.closingDate}>
                                &nbsp;&middot;&nbsp;
                                <lightning-formatted-date-time
                                    value={row.closingDate}
                                    month="short"
                                    day="2-digit"
                                    year="numeric"
                                    time-zone="UTC">
                                </lightning-formatted-date-time>
                            </template>
                        </div>

                        <template if:true={row.address}>
                            <div class="slds-text-body_small slds-text-color_weak slds-truncate">
                                {row.address}
                            </div>
                        </template>
                    </li>
                </template>
            </ul>
        </template>
    </lightning-card>
</template>
