<template>
    <template lwc:if={shape}>
        <svg
            class="icon"
            style={sizeStyle}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            role={role}
            aria-label={ariaLabel}
            aria-hidden={ariaHidden}
            focusable="false"
        >
            <template for:each={shape.paths} for:item="segment">
                <path key={segment.key} d={segment.d}></path>
            </template>
            <template for:each={shape.circles} for:item="segment">
                <circle key={segment.key} cx={segment.cx} cy={segment.cy} r={segment.r}></circle>
            </template>
            <template for:each={shape.rects} for:item="segment">
                <rect
                    key={segment.key}
                    x={segment.x}
                    y={segment.y}
                    width={segment.width}
                    height={segment.height}
                    rx={segment.rx}
                ></rect>
            </template>
        </svg>
    </template>
</template>
