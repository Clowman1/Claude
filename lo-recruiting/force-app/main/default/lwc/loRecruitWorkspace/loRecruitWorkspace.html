<template>
    <template lwc:if={error}><div class="card pad err" role="alert">{error}</div></template>
    <template lwc:if={loading}><div class="card pad"><lightning-spinner alternative-text="Loading recruit" size="small"></lightning-spinner></div></template>

    <template lwc:if={r}>
        <div class="wrap">
            <section class="card head">
                <div class="toprow">
                    <div class="av big">{r.initials}</div>
                    <div class="grow">
                        <div class="namerow">
                            <h2 class="name">{r.name}</h2>
                            <span class={stageChipCls}>{r.stage}</span>
                            <template lwc:if={r.branchManager}><span class="chip re">Branch Mgr</span></template>
                            <template lwc:if={r.inHouse}><span class="chip ti">Possible In House</span></template>
                            <template lwc:if={r.remote}><span class="chip oth">Remote LO</span></template>
                        </div>
                        <div class="muted sub">{subLine}</div>
                    </div>
                </div>

                <template lwc:if={r.companySwitch}>
                    <div class="flag" role="note">⚠️ Possible company switch: {detail.flag}</div>
                </template>
                <template lwc:elseif={detail.flag}>
                    <div class="note-flag">{detail.flag}</div>
                </template>

                <div class="actionsrow">
                    <template lwc:if={dialPhone}>
                        <span class="dial"><lightning-click-to-dial value={dialPhone} record-id={r.id}></lightning-click-to-dial></span>
                    </template>
                    <template lwc:if={smsHref}><a class="btn" href={smsHref}><lightning-icon icon-name="utility:sms" size="x-small"></lightning-icon>Text</a></template>
                    <template lwc:if={mailHref}><a class="btn" href={mailHref}><lightning-icon icon-name="utility:email" size="x-small"></lightning-icon>Email</a></template>
                    <button class="btn btn-p" onclick={openTouch}>Log touch</button>
                    <button class="btn" onclick={openInvite}><lightning-icon icon-name="utility:event" size="x-small"></lightning-icon>In Person Meeting</button>
                    <span class="grow"></span>
                    <template lwc:if={isHired}>
                        <template lwc:if={detail.candidateAccountId}>
                            <button class="btn" data-id={detail.candidateAccountId} onclick={openRecord}>Open Candidate account</button>
                        </template>
                    </template>
                    <template lwc:else>
                        <button class="btn" disabled={busy} onclick={notInterested}>Not Interested</button>
                        <button class="btn btn-o" disabled={busy} onclick={hired}>Mark Hired</button>
                    </template>
                </div>

                <template lwc:if={offPath}>
                    <div class="dormant">{offPathNote}</div>
                </template>
                <template lwc:else>
                    <div>
                        <div class="steps">
                            <template for:each={pathSteps} for:item="s"><div key={s.value} class={s.barCls}></div></template>
                        </div>
                        <div class="steplbls">
                            <template for:each={pathSteps} for:item="s"><span key={s.value} class={s.labelCls}>{s.value}</span></template>
                        </div>
                    </div>
                </template>
            </section>

            <template lwc:if={showInvite}>
                <c-bd-invite-modal partners={invitePartners} preselected-ids={inviteIds} rep-first-name={repFirstName}
                heading="In person meeting" scope="recruit" onclose={closeInvite} onsent={inviteSent}></c-bd-invite-modal>
            </template>
            <template lwc:if={showTouch}>
                <c-lo-recruit-touch-modal recruit-id={r.id} recruit-name={r.name} onlogged={touchLogged} onclose={closeTouch}></c-lo-recruit-touch-modal>
            </template>

            <div class="cols">
                <section class="card main">
                    <div class="tabs" role="tablist">
                        <button class={timelineTabCls} role="tab" data-tab="timeline" onclick={showTab}>Timeline</button>
                        <button class={notesTabCls} role="tab" data-tab="notes" onclick={showTab}>Recruiting Notes ({noteCount})</button>
                        <button class={zoomTabCls} role="tab" data-tab="zoom" onclick={showTab}>Zoom</button>
                        <button class={ringSenseTabCls} role="tab" data-tab="ringsense" onclick={showTab}>RingSense</button>
                        <button class={detailsTabCls} role="tab" data-tab="details" onclick={showTab}>Details</button>
                    </div>
                    <template lwc:if={isTimeline}>
                        <template lwc:if={hasTimeline}>
                            <template for:each={timeline} for:item="t">
                                <div key={t.id} class="tl">
                                    <div class={t.dotCls}><lightning-icon icon-name={t.icon} size="x-small"></lightning-icon></div>
                                    <div class="grow">
                                        <div class="strong">{t.title}</div>
                                        <div class="muted small pre">{t.detail}</div>
                                    </div>
                                    <span class="muted small nowrap">{t.when}</span>
                                </div>
                            </template>
                        </template>
                        <template lwc:else><div class="empty muted">No history yet. Calls, texts, emails and meetings show up here automatically.</div></template>
                    </template>
                    <template lwc:if={isZoom}>
                        <div class="rs"><c-bd-zoom-panel record-id={r.id} onscheduled={meetingScheduled}></c-bd-zoom-panel></div>
                    </template>
                    <template lwc:if={isRingSense}>
                        <div class="rs"><c-call-insight-list record-id={r.id} source="RingSense"></c-call-insight-list></div>
                    </template>
                    <template lwc:if={isNotes}>
                        <div class="composer">
                            <lightning-textarea label="New recruiting note" variant="label-hidden" value={noteDraft} onchange={handleNoteDraft}
                                placeholder="Add a recruiting note…"></lightning-textarea>
                            <div class="actions"><button class="btn btn-p btn-s" disabled={noteDisabled} onclick={saveNote}>Save note</button></div>
                        </div>
                        <template lwc:if={hasNotes}>
                            <template for:each={notes} for:item="n">
                                <div key={n.id} class="tl">
                                    <div class="dot n"><lightning-icon icon-name="utility:note" size="x-small"></lightning-icon></div>
                                    <div class="grow">
                                        <div class="strong">{n.title}</div>
                                        <div class="small pre notebody">{n.body}</div>
                                        <div class="muted small">{n.author} · <button class="linkish small" data-id={n.id} onclick={openRecord}>Open note</button></div>
                                    </div>
                                    <span class="muted small nowrap">{n.when}</span>
                                </div>
                            </template>
                        </template>
                        <template lwc:else><div class="empty muted">No notes yet. Notes typed in Log touch show up here too.</div></template>
                    </template>
                    <template lwc:if={isDetails}>
                        <dl class="dl">
                            <dt>Company</dt><dd>{r.company}</dd>
                            <dt>NMLS</dt><dd>{r.nmls}</dd>
                            <dt>Loan volume</dt><dd>{subLine}</dd>
                            <dt>Cell</dt><dd>{r.mobile}</dd>
                            <dt>Work phone</dt><dd>{r.phone}</dd>
                            <dt>Work email</dt><dd>{r.email}</dd>
                            <dt>Personal email</dt><dd>{detail.personalEmail}</dd>
                            <dt>Office</dt><dd>{office}</dd>
                            <dt>County</dt><dd>{r.county}</dd>
                            <dt>Recent agent partner</dt><dd>{agentLine}</dd>
                            <dt>Recruit list</dt><dd>{detail.recruitList}</dd>
                            <dt>Flag / reason</dt><dd>{detail.flag}</dd>
                        </dl>
                    </template>
                </section>

                <aside class="side">
                    <section class="card pad facts">
                        <div class="lbl">Recruiting</div>
                        <lightning-combobox label="Recruiter" options={recruiterOptions} value={r.ownerId} onchange={changeRecruiter} disabled={busy}></lightning-combobox>
                        <template lwc:if={isOpen}>
                            <lightning-combobox label="Stage" options={stageOptions} value={r.stage} onchange={changeStage} disabled={busy}></lightning-combobox>
                            <lightning-input type="date" label="Next touch" value={r.nextTouch} onchange={changeNext} disabled={busy}></lightning-input>
                        </template>
                        <div class="fact"><span class="muted">Last activity</span><b>{lastActivityLabel}</b></div>
                        <div class="fact"><span class="muted">Calls · 30d</span><b>{detail.calls30}</b></div>
                        <template lwc:if={agentLine}>
                            <div class="talk">
                                <div class="lbl">Talking point</div>
                                <div class="small">Recently closed with <b>{agentLine}</b></div>
                            </div>
                        </template>
                        <button class="linkish" onclick={openRecord}>Open full lead</button>
                    </section>
                    <template lwc:if={hasLinks}>
                        <section class="card pad facts">
                            <div class="lbl">Profiles</div>
                            <template for:each={links} for:item="l">
                                <a key={l.label} class="plink" href={l.url} target="_blank" rel="noopener noreferrer">{l.label} ↗</a>
                            </template>
                        </section>
                    </template>
                </aside>
            </div>
        </div>
    </template>
</template>
