<template>
    <div class="lookup">
        <label class="label" for="realtor-search">
            <template if:true={required}>
                <abbr class="required" title="required">*</abbr>
            </template>
            {label}
        </label>

        <template if:true={hasSelection}>
            <div class="selected">
                <div>
                    <div class="selected-name">{selectedLabel}</div>
                    <template if:true={selectedSubtitle}>
                        <div class="selected-subtitle">{selectedSubtitle}</div>
                    </template>
                </div>
                <button type="button" class="clear-button" onclick={clearSelection} title="Clear selection">Clear</button>
            </div>
        </template>

        <template if:true={showLookupSearch}>
            <div class="input-wrap">
                <input
                    id="realtor-search"
                    class="search-input"
                    type="search"
                    value={searchTerm}
                    placeholder="Search Realtor accounts..."
                    oninput={handleSearchChange}
                    onfocus={handleFocus}
                />
            </div>

            <template if:true={showResults}>
                <div class="results" role="listbox">
                    <template for:each={options} for:item="option">
                        <button
                            key={option.value}
                            type="button"
                            class="result"
                            data-id={option.value}
                            data-label={option.label}
                            data-subtitle={option.subtitle}
                            onclick={selectOption}
                        >
                            <span class="result-name">{option.label}</span>
                            <template if:true={option.subtitle}>
                                <span class="result-subtitle">{option.subtitle}</span>
                            </template>
                        </button>
                    </template>
                </div>
            </template>

            <template if:true={showNoResults}>
                <div class="hint">No matching Realtor accounts found.</div>
            </template>
            <template if:true={isSearching}>
                <div class="hint">Searching...</div>
            </template>
            <button type="button" class="create-link" onclick={openCreatePanel}>
                Create a new Realtor Partner
            </button>
        </template>

        <template if:true={isCreateOpen}>
            <section class="create-panel" aria-label="Create Realtor Partner">
                <div class="create-panel-header">
                    <div>
                        <div class="create-title">Create Realtor Partner</div>
                        <div class="create-subtitle">Use this when the buyer's agent is not already in Salesforce.</div>
                    </div>
                    <button type="button" class="clear-button" onclick={closeCreatePanel}>Back to search</button>
                </div>
                <div class="create-grid">
                    <lightning-input label="First Name" value={createFirstName} data-field="createFirstName" data-create-realtor-input="true" onchange={handleCreateInput} required></lightning-input>
                    <lightning-input label="Last Name" value={createLastName} data-field="createLastName" data-create-realtor-input="true" onchange={handleCreateInput} required></lightning-input>
                    <lightning-input type="tel" label="Phone" value={createPhone} data-field="createPhone" data-create-realtor-input="true" onchange={handleCreateInput} required></lightning-input>
                    <lightning-input type="email" label="Email" value={createEmail} data-field="createEmail" data-create-realtor-input="true" onchange={handleCreateInput} required></lightning-input>
                    <lightning-combobox label="Biz Dev Designation" value={createBizDevDesignation} data-field="createBizDevDesignation" data-create-realtor-input="true" options={bizDevOptions} onchange={handleCreateInput} required></lightning-combobox>
                </div>
                <div class="create-actions">
                    <button type="button" class="create-cancel" onclick={closeCreatePanel} disabled={isCreating}>Cancel</button>
                    <button type="button" class="create-submit" onclick={createRealtorAccount} disabled={isCreating}>{createButtonLabel}</button>
                </div>
            </section>
        </template>

        <template if:true={showDuplicateModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="dup-heading" class="slds-modal slds-fade-in-open slds-modal_small">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="dup-heading" class="slds-modal__title slds-hyphenate">{duplicateHeading}</h2>
                        <p class="slds-m-top_x-small slds-text-body_small">
                            Select the existing account below instead of creating a new one.
                        </p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <template for:each={duplicateMatches} for:item="match">
                            <div key={match.accountId} class="dup-row">
                                <div class="dup-row-main">
                                    <div class="dup-name">{match.name}</div>
                                    <div class="dup-meta">
                                        <template if:true={match.brokerage}>{match.brokerage} &middot; </template>
                                        <template if:true={match.realtorGroup}>{match.realtorGroup} &middot; </template>
                                        Matched on {match.matchedOn}
                                    </div>
                                    <div class="dup-meta">
                                        <template if:true={match.phone}>{match.phone}</template>
                                        <template if:true={match.email}> &middot; {match.email}</template>
                                    </div>
                                    <div class="dup-meta">
                                        <template if:true={match.ownerName}>Owner {match.ownerName} &middot; </template>
                                        Loan files: {match.loanFiles}
                                    </div>
                                </div>
                                <button type="button" class="dup-use" data-id={match.accountId} onclick={useExistingAccount}>
                                    Use this account
                                </button>
                            </div>
                        </template>
                        <template if:true={isPhoneOnlyMatch}>
                            <p class="dup-hint">
                                Only the phone number matched. If this is a different agent at the same
                                office, go back and enter that agent&rsquo;s own direct mobile number
                                rather than the office line.
                            </p>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <button type="button" class="create-cancel" onclick={closeDuplicateModal}>
                            Back to the form
                        </button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={errorMessage}>
            <div class="error">{errorMessage}</div>
        </template>
    </div>
</template>
