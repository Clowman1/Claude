<template>
    <template lwc:if={loading}>
        <span class="cc-spinner" aria-hidden="true"></span>
    </template>
    <template lwc:elseif={loadError}>
        <p class="cc-error" role="alert">{loadError}</p>
    </template>
    <template lwc:elseif={editing}>
        <form class="cc-form" onsubmit={handleSave}>
            <template lwc:if={info.isBorrower}>
                <div class="cc-row">
                    <label class="cc-field cc-grow">First name<input class="cc-input" data-field="firstName" value={draft.firstName} oninput={handleInput} /></label>
                    <label class="cc-field cc-grow">Last name<input class="cc-input" data-field="lastName" value={draft.lastName} oninput={handleInput} /></label>
                </div>
                <label class="cc-field">Relationship
                    <select class="cc-input" data-field="relationship" onchange={handleInput}>
                        <option value="">—</option>
                        <template for:each={relationshipOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.value}</option></template>
                    </select>
                </label>
            </template>
            <label class="cc-field">Phone<input class="cc-input" type="tel" data-field="phone" value={draft.phone} oninput={handleInput} /></label>
            <label class="cc-field">Email<input class="cc-input" type="email" data-field="email" value={draft.email} oninput={handleInput} /></label>
            <template lwc:if={hasAddress}>
                <label class="cc-field">Street<input class="cc-input" data-field="street" value={draft.street} oninput={handleInput} /></label>
                <div class="cc-row">
                    <label class="cc-field cc-grow">City<input class="cc-input" data-field="city" value={draft.city} oninput={handleInput} /></label>
                    <label class="cc-field cc-state">State<input class="cc-input" data-field="state" value={draft.state} oninput={handleInput} /></label>
                    <label class="cc-field cc-zip">Zip<input class="cc-input" data-field="postalCode" value={draft.postalCode} oninput={handleInput} /></label>
                </div>
            </template>
            <template lwc:if={saveError}>
                <p class="cc-error" role="alert">{saveError}</p>
            </template>
            <div class="cc-actions">
                <button type="button" class="cc-btn cc-btn-outline" onclick={handleCancel} disabled={saving}>Cancel</button>
                <button type="submit" class="cc-btn cc-btn-brand" disabled={saving}>Save</button>
            </div>
        </form>
    </template>
    <template lwc:else>
        <template lwc:if={info.noEmailWarning}>
            <p class="cc-warning" role="note">{info.noEmailWarning}</p>
        </template>
        <template lwc:if={info.nextAppointment}>
            <p class="cc-appointment">{info.nextAppointment}</p>
        </template>
        <ul class="cc-list cc-list-grid">
            <template for:each={rows} for:item="row">
                <li key={row.label} class="cc-item">
                    <span class="cc-label">{row.label}</span>
                    <template lwc:if={row.href}>
                        <a class="cc-value cc-link" href={row.href}>{row.value}</a>
                    </template>
                    <template lwc:else>
                        <span class="cc-value">{row.value}</span>
                    </template>
                </li>
            </template>
        </ul>
        <template lwc:if={isEmpty}>
            <p class="cc-empty">No contact details on file.</p>
        </template>
        <template lwc:if={info.canEdit}>
            <div class="cc-actions cc-actions-start">
                <button type="button" class="cc-btn cc-btn-outline" onclick={handleEdit}>Edit</button>
                <template lwc:if={info.isBorrower}>
                    <button type="button" class="cc-btn cc-btn-outline" onclick={handleRemove} disabled={saving}>Remove borrower</button>
                </template>
            </div>
            <template lwc:if={saveError}>
                <p class="cc-error" role="alert">{saveError}</p>
            </template>
        </template>
        <template lwc:elseif={info.note}>
            <p class="cc-note">{info.note}</p>
        </template>
    </template>
</template>
