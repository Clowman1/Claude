<template>
    <div class="al-backdrop">
        <aside class="al-drawer" role="dialog" aria-modal="true" aria-label="Add a lead">
            <form class="al-form" onsubmit={handleSubmit} novalidate>
                <h2 class="al-title">Add a lead</h2>
                <div class="al-row">
                    <label class="al-field">First name *<input class="al-input" data-field="firstName" value={form.firstName} oninput={handleInput} required autocomplete="off" /></label>
                    <label class="al-field">Last name *<input class="al-input" data-field="lastName" value={form.lastName} oninput={handleInput} required autocomplete="off" /></label>
                </div>
                <label class="al-field">Phone *<input class="al-input" type="tel" data-field="phone" value={form.phone} oninput={handleInput} required /></label>
                <label class="al-field">Email *<input class="al-input" type="email" data-field="email" value={form.email} oninput={handleInput} required /></label>
                <label class="al-field">Loan purpose *
                    <select class="al-input" data-field="purpose" onchange={handleInput} required>
                        <option value="">Choose…</option>
                        <template for:each={purposeOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template>
                    </select>
                </label>
                <label class="al-field">Referring realtor
                    <template lwc:if={locked}>
                        <input class="al-input al-locked" value={realtorName} disabled />
                        <span class="al-hint">Set from this realtor. To use another, close and add the lead from My Leads.</span>
                    </template>
                    <template lwc:else>
                        <select class="al-input" data-field="realtorId" onchange={handleInput}>
                            <template for:each={realtorOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template>
                        </select>
                        <span class="al-hint">Optional. Your own partners from My Realtors.</span>
                    </template>
                </label>
                <template lwc:if={error}>
                    <p class="al-error" role="alert">{error}</p>
                </template>
                <div class="al-actions">
                    <button type="button" class="al-btn al-btn-outline" onclick={handleClose} disabled={saving}>Cancel</button>
                    <button type="submit" class="al-btn al-btn-brand" disabled={saving}>Create lead</button>
                </div>
            </form>
        </aside>
    </div>
</template>
