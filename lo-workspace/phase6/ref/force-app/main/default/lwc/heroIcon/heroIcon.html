<!-- WC icon -->
<template>
    <template lwc:if={isLoading}>
        <svg width={scaleAsEm} height={scaleAsEm} style={iconStyle}  stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <g class="spinner_V8m1">
                <circle cx="12" cy="12" r="9.5" fill="none" stroke-width="3"></circle>
            </g>
        </svg>
    </template>
    <template lwc:elseif={name}>
        <hero-icon lwc:external
                   name={name}
                   scale={scale}
                   rotate={rotate}
                   block={block}
                   stroke={stroke}
                   style={iconStyle}
        ></hero-icon>

    </template>


</template>
