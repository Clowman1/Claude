<template>
    <div class="action-strip">
        <div class="strip-label">
            <span>Lead Actions</span>
        </div>
        <div class="button-row">
            <template for:each={visibleActions} for:item="action">
                <button
                    key={action.key}
                    class={action.className}
                    type="button"
                    data-api={action.apiName}
                    onclick={openQuickAction}
                >
                    {action.label}
                </button>
            </template>
        </div>
    </div>
    <template lwc:if={showConversion}>
        <c-external-lo-lead-conversion-modal
            context-record-key={recordId}
            onclose={closeConversion}
            onconverted={handleConverted}
        ></c-external-lo-lead-conversion-modal>
    </template>
</template>
